# Builds the Docusaurus site in website/ and deploys to Cloudflare Pages
# Supports both production deploys (on push to `main`) and live PR previews (on pull_request).

name: Deploy docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'hardware/**'
      - 'tools/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The board silkscreens ${VCSSHORTHASH}, which never survives a headless export.
      # Substitute the commit into the board files so rendered board assets show the SHA.
      - name: Stamp the board with the commit it was built from
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - "$COMMIT_SHA" <<'PYEOF'
          import sys

          short = sys.argv[1][:7]
          hub_path = "hardware/hub/SunSproutHub.kicad_pcb"
          sat_path = "hardware/satellite/SunSproutSatellite.kicad_pcb"

          for path in [hub_path, sat_path]:
              with open(path, encoding="utf-8") as f:
                  board = f.read()

              found = board.count("${VCSSHORTHASH}")
              if path == hub_path and not found:
                  sys.exit("No ${VCSSHORTHASH} left in the hub board - the silkscreen changed, "
                           "and this step would have silently shipped an unstamped panel.")

              if found:
                  with open(path, "w", encoding="utf-8", newline="") as f:
                      f.write(board.replace("${VCSSHORTHASH}", short))
                  print(f"Stamped {path}: {short} ({found} occurrences)")
          PYEOF

      - name: Generate documentation assets
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          chmod +x tools/generate-docs-assets.sh
          ./tools/generate-docs-assets.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build Docusaurus
        working-directory: website
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/build --project-name=sunsprout --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment PR Preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const aliasUrl = '${{ steps.deploy.outputs.pages-deployment-alias-url }}';
            const deployUrl = '${{ steps.deploy.outputs.deployment-url }}';
            const previewUrl = aliasUrl || deployUrl;
            const body = `### Cloudflare Pages Preview\n\n**Preview URL:** ${previewUrl}\n\n*Built with commit ${context.sha.substring(0, 7)}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => comment.body.includes('Cloudflare Pages Preview'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
