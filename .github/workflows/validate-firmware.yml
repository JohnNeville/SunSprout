# Validates the ESPHome configuration whenever the firmware changes.
#
# Only `esphome config` runs here, not `esphome compile`. The chip drivers live in
# JohnNeville/esphome-bq-drivers and are compiled by that repository's own CI, which is
# where a C++ error would surface. What this job checks is that the board package and the
# example device still describe a valid configuration against the current driver schemas
# and the current ESPHome release -- which is exactly what breaks when either moves.

name: Validate firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/validate-firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/validate-firmware.yml'
  workflow_dispatch:

jobs:
  validate:
    name: esphome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Write placeholder secrets
        # The example config reads secrets that obviously are not in the repo.
        # `esphome config` only needs the keys to resolve, not to be real.
        run: |
          cat > firmware/secrets.yaml <<'EOF'
          wifi_ssid: "placeholder"
          wifi_password: "placeholder"
          fallback_password: "placeholder"
          # Placeholder, not a real key: base64 of the text "placeholder-api-key-do-not-use!!".
          # ESPHome rejects an all-zeros key, so it has to be non-zero. Never use it on a device.
          api_encryption_key: "cGxhY2Vob2xkZXItYXBpLWtleS1kby1ub3QtdXNlISE="
          EOF

      - name: Validate the example device
        run: esphome config firmware/example-device.yaml

      - name: Validate the factory image
        run: esphome config firmware/sunsprout-factory.yaml

      - name: Validate a standard lithium-ion build
        # The substitutions documented in firmware/README.md must keep building.
        run: |
          # -s is a top-level option: after the subcommand it is silently ignored.
          esphome \
            -s cell_chemistry li_ion \
            -s battery_capacity 3000 \
            -s battery_energy_mwh 11100 \
            -s lifepo4_relax false \
            config firmware/example-device.yaml
