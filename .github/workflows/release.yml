# Builds the fabrication and mechanical outputs for a board revision and attaches them to
# the GitHub Release.
#
# These are the artifacts that are deliberately NOT committed: the STEP model is ~19MB and
# changes with every layout edit, and the gerbers are a pure build product of the board file.
# Publishing them per release keeps them available without accumulating copies in git history.
#
# There are two ways in:
#
#   - Push a tag, and the release is cut from it:
#       git tag -a hub-v1.0 -m "Hub rev A" && git push origin hub-v1.0
#
#   - Run it by hand from the Actions tab, naming the version to publish. The tag is created
#     at whatever commit you dispatch from, so this can cut a release without tagging first.
#
# Either way the version string is the tag name. A suffix on it (hub-v1.0-rc1) means a
# pre-release; a bare version (hub-v1.0) means a full one. The manual run can override that.

name: Release artifacts

on:
  push:
    tags:
      - 'v*'
      - 'hub-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. hub-v1.0 or hub-v1.0-rc1. Tagged at the commit you run from.'
        required: true
        type: string
      prerelease:
        description: 'Publish as a pre-release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Get short sha
        shell: sh
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_ENV

      # A tag push carries its version in the ref; a manual run carries it in the inputs.
      # Settle which it is once here so the release step below has a single source to read.
      - name: Resolve the version being released
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag=$INPUT_VERSION
            prerelease=$INPUT_PRERELEASE
          else
            tag=$REF_NAME
            # Strip the optional board prefix before looking for a pre-release suffix, so that
            # the hyphen in 'hub-v1.0' is not mistaken for one.
            case "${tag#hub-}" in
              *-*) prerelease=true ;;
              *) prerelease=false ;;
            esac
          fi

          # A manual run can name anything, so check it looks like a version before it becomes
          # a tag that has to be cleaned up afterwards.
          case "$tag" in
            v[0-9]*|hub-v[0-9]*) ;;
            *)
              echo "::error::'$tag' is not a version this workflow publishes. Use v<number> or hub-v<number>, e.g. hub-v1.0 or hub-v1.0-rc1."
              exit 1
              ;;
          esac

          echo "Publishing $tag (prerelease=$prerelease)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # The board silkscreens ${VCSSHORTHASH}, which never survives a headless export.
      # kicad-cli renders the literal "no hash" even inside the git repo (verified by plotting
      # F.SilkS from the working tree and from a copy outside any repo - byte-identical), and
      # Fabrication Toolkit does not apply the project's text variables at all. REV_NUM only
      # survives because KiCad caches it into the board as a (property ...), which the hash
      # has no equivalent of.
      #
      # So substitute the commit into the board itself rather than into the project: a literal
      # needs no resolver, and every downstream tool renders it the same. Workspace-only; this
      # is never committed back.
      - name: Stamp the board with the commit it was built from
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - "$COMMIT_SHA" <<'PYEOF'
          import sys

          short = sys.argv[1][:7]
          path = "hardware/hub/SunSproutHub.kicad_pcb"

          with open(path, encoding="utf-8") as f:
              board = f.read()

          found = board.count("${VCSSHORTHASH}")
          if not found:
              sys.exit("No ${VCSSHORTHASH} left in the board - the silkscreen changed, "
                       "and this step would have silently shipped an unstamped panel.")

          with open(path, "w", encoding="utf-8", newline="") as f:
              f.write(board.replace("${VCSSHORTHASH}", short))

          print(f"Silkscreen will read: {short} ({found} occurrences)")
          PYEOF

      - name: Prepare output directory
        run: mkdir -p release

      # The fab set comes from Fabrication Toolkit rather than kicad-cli, because JLCPCB
      # rejects kicad-cli's pick-and-place outright: it emits Ref,Val,Package,PosX,PosY,Rot,Side
      # where the uploader wants Designator,Mid X,Mid Y,Rotation,Layer. The toolkit writes
      # JLCPCB's own headers, applies the rotation and offset corrections their assembler
      # expects, and names the gerbers with the Protel extensions they recommend.
      #
      # Pinned to the same 5.3.1 that tools/kicad-ci.Dockerfile uses, so a release is built
      # with the version this project has actually validated against. The stock KiCad image
      # ships git and python3 but not xvfb, and the toolkit's CLI still imports wx, which
      # needs a display to attach to even non-interactively.
      - name: Install Fabrication Toolkit
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends xvfb
          git clone --depth 1 --branch 5.3.1             https://github.com/bennymeg/Fabrication-Toolkit.git /opt/fabrication-toolkit

      - name: JLCPCB fabrication set
        run: |
          cd /opt/fabrication-toolkit
          xvfb-run -a -s '-screen 0 1024x768x24' python3 -m plugins.cli             --path "$GITHUB_WORKSPACE/hardware/hub/SunSproutHub.kicad_pcb"             --autoTranslate --autoFill --excludeDNP --nonInteractive

      # The toolkit writes to a production/ directory beside the board, under its own generic
      # filenames. Rename them onto the BOM-/CPL-/GERBER- convention this project already
      # documents, so a release asset says what it is without being opened.
      - name: Collect the fabrication set
        run: |
          prod="hardware/hub/production"
          if [ ! -d "$prod" ]; then
            echo "::error::Fabrication Toolkit produced no output directory"
            exit 1
          fi

          cp "$prod/bom.csv" release/BOM-SunSproutHub_$GITHUB_REF_NAME_$SHORT_SHA.csv
          cp "$prod/positions.csv" release/CPL-SunSproutHub_$GITHUB_REF_NAME_$SHORT_SHA.csv
          if [ -f "$prod/netlist.ipc" ]; then
            cp "$prod/netlist.ipc" release/IPC-SunSproutHub_$GITHUB_REF_NAME_$SHORT_SHA.ipc
          fi

          # Named after the board's title-block revision, so match on extension, not on a
          # filename this workflow would have to keep in step with the board.
          archive=$(find "$prod" -maxdepth 1 -name '*.zip' | head -n1)
          if [ -z "$archive" ]; then
            echo "::error::Fabrication Toolkit produced no gerber archive"
            exit 1
          fi
          cp "$archive" release/GERBER-SunSproutHub_$GITHUB_REF_NAME_$SHORT_SHA.zip
  
      - name: Schematic PDF
        run: |
          kicad-cli sch export pdf \
            -o release/SunSproutHub-schematic.pdf \
            hardware/hub/SunSproutHub_$GITHUB_REF_NAME_$SHORT_SHA.kicad_sch

      - name: STEP model
        run: |
          kicad-cli pcb export step \
            --subst-models -f \
            -o release/SunSproutHub.step \
            hardware/hub/SunSproutHub_$GITHUB_REF_NAME_$SHORT_SHA.kicad_pcb

      - name: List artifacts
        run: ls -lh release/

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          tag_name: ${{ steps.release.outputs.tag }}
          # Without this the API tags the default branch instead, which on a manual run from
          # a branch would point the tag at a different commit than the artifacts were built
          # from. Pin it to the commit this job actually checked out.
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Fabrication and mechanical outputs for this revision, generated from
            `hardware/hub/SunSproutHub.kicad_pcb` by this workflow.

            Some parts have no redistributable 3D model and render bodyless in the STEP
            file. They are mechanically positioned correctly; only the visual body is
            absent. See `hardware/hub/README.md`.
