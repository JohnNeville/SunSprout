# Battery burn-down test: drain a cell on purpose to check discharge behaviour.
#
# A low-priority task spins the CPU, WiFi runs at full power and the status LED and the user
# rail are on. When the charger's battery voltage has read at or below `cutoff_voltage` for
# three samples in a row, the loop stops, the LED and the user rail go off and the board
# goes into deep sleep for seven days so it stops draining the cell. Press reset or
# power-cycle the board to wake it.
#
# Run it from battery with USB and solar disconnected, otherwise the charger refills the cell
# as fast as the loop empties it. The voltage is read under load, so it sags below the
# resting voltage: the cell will recover a little once the loop stops.
#
# Set the cell values below to match the cell you are draining.

substitutions:
  name: sunsprout-burn-test
  friendly_name: Sunsprout Burn Test

  # A 2000 mAh lithium-ion cell. For LiFePO4 use "lifepo4", its capacity, and capacity x 3.2 V.
  cell_chemistry: "li_ion"
  battery_capacity: "2000"
  battery_energy_mwh: "7400"
  lifepo4_relax: "false"
  charge_current: "500"

  # Stop burning at or below this battery voltage (volts), under load. Do not set it below
  # the cell's own discharge cutoff.
  cutoff_voltage: "3.2"

packages:
  hub: !include sunsprout-hub.yaml
  common: !include sunsprout-common.yaml
  # No deep-sleep package: the board must stay awake until the cutoff.

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  on_boot:
    - priority: -100
      then:
        # A low-priority task that spins the CPU for ~90 ms, then blocks for one tick so the
        # idle task still runs and feeds the watchdog. The ESPHome main task shares this
        # priority, so WiFi, the API and the sensors keep working.
        - lambda: |-
            xTaskCreate([](void *) {
              volatile float acc = 1.0f;
              for (;;) {
                if (!id(burn_on)) {
                  vTaskDelay(pdMS_TO_TICKS(100));
                  continue;
                }
                const uint32_t start = micros();
                while (micros() - start < 90000) {
                  for (int i = 0; i < 1000; i++) {
                    acc = acc * 1.000001f + std::sqrt(acc + (float) i);
                    if (acc > 1e6f) acc = 1.0f;
                  }
                }
                vTaskDelay(1);
              }
            }, "burn", 2048, nullptr, 1, nullptr);
        - if:
            condition:
              switch.is_on: battery_burn
            then:
              - globals.set:
                  id: burn_on
                  value: "true"
              - light.turn_on: status_led

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none

bq25798:
  # No thermistor fitted. Without this the charger suspends charging when it reads "too cold".
  ts_ignore: true
  # Sample the battery faster than the package's 30 s so the cutoff reacts promptly.
  update_interval: 10s

deep_sleep:
  id: burn_sleep

switch:
  # The user rail adds a little load, as a sensor on it would.
  - id: !extend user_rail
    restore_mode: ALWAYS_ON

  # The burn itself. Remembered across reboots, so a cutoff stays cut off: after a trip this
  # is off and stays off until you turn it back on from Home Assistant.
  - platform: template
    name: "Battery Burn"
    id: battery_burn
    icon: "mdi:fire"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - globals.set:
          id: low_samples
          value: "0"
      - globals.set:
          id: burn_on
          value: "true"
      - light.turn_on: status_led
    turn_off_action:
      - globals.set:
          id: burn_on
          value: "false"
      - light.turn_off: status_led

globals:
  - id: burn_on
    type: bool
    initial_value: "false"
  - id: low_samples
    type: int
    initial_value: "0"

# Stop the burn after 3 consecutive 10 s readings at or below the cutoff.
interval:
  - interval: 10s
    then:
      - lambda: |-
          const float v = id(charger_vbat).state;
          if (id(battery_burn).state && !std::isnan(v) && v <= ${cutoff_voltage}f) {
            id(low_samples)++;
          } else {
            id(low_samples) = 0;
          }
      - if:
          condition:
            lambda: return id(low_samples) >= 3;
          then:
            - logger.log:
                format: "Battery at %.3f V, at or below ${cutoff_voltage} V: stopping the burn and sleeping."
                args: ["id(charger_vbat).state"]
                level: WARN
            - switch.turn_off: battery_burn
            - switch.turn_off: user_rail
            # WiFi at full power draws well over 100 mA, so leaving the board awake would keep
            # draining the cell. Sleep for a week; reset or power-cycle to wake it.
            - deep_sleep.enter:
                id: burn_sleep
                sleep_duration: 7d
