# A complete SunSprout hub device, built from the firmware packages.
#
# Copy this, change the substitutions and the secrets, and flash it. The pieces:
#
#   sunsprout-hub.yaml         the hardware: charger, fuel gauge, buses, LED, user rail
#   sunsprout-common.yaml      logging and diagnostics every device wants
#   sunsprout-deep-sleep.yaml  optional deep sleep (remove the line to stay awake)
#
# Everything below is the part you write for any ESPHome device. To ship an image
# that asks the end user for WiFi instead, see sunsprout-factory.yaml.

substitutions:
  name: sunsprout
  friendly_name: Sunsprout

  # Override the board package's defaults for your cell. These are the LiFePO4
  # defaults; README.md lists the values for a standard lithium-ion cell.
  battery_capacity: "6000"
  battery_energy_mwh: "19200"

packages:
  hub: !include sunsprout-hub.yaml
  common: !include sunsprout-common.yaml
  deep_sleep: !include sunsprout-deep-sleep.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: JohnNeville.SunSproutHub
    version: DIY

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:
