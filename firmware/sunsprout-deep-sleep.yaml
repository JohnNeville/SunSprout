# Optional deep sleep for battery or solar-powered hubs.
#
#   packages:
#     hub: !include sunsprout-hub.yaml
#     common: !include sunsprout-common.yaml
#     deep_sleep: !include sunsprout-deep-sleep.yaml
#
# Leave it out while you are setting a board up: a sleeping board is awake for only
# two minutes in every seventeen, which is not much time to flash or configure it.

esphome:
  on_boot:
    # Before the deep_sleep component starts its timer, so a held-awake board
    # stays awake through the whole boot.
    - priority: 600
      then:
        - if:
            condition:
              lambda: 'return id(prevent_sleep_global);'
            then:
              - deep_sleep.prevent: deep_sleep_control
              - logger.log:
                  format: "Deep sleep held off by the prevent_sleep flag."
                  tag: setup

  on_shutdown:
    - priority: 700
      then:
        # Cut power to the user 3V3 rail before entering sleep.
        - switch.turn_off: user_rail
        # Float GPIO9 (SDA_USER) and GPIO10 (SCL_USER) to High-Z (no pull-up/pull-down)
        # to prevent 1.40 mA continuous leakage through 4.7k pull-ups (R201/R202) into
        # the unpowered 3V3_USER rail (held at 0V by TPS22918 quick output discharge).
        # Note: BQ25798 /INT and BQ34Z100 /ALERT interrupts are cleared automatically
        # by their respective driver on_shutdown hooks to eliminate 660 uA leakage on R24/R401.
        - lambda: |-
            gpio_set_direction(GPIO_NUM_9, GPIO_MODE_INPUT);
            gpio_set_pull_mode(GPIO_NUM_9, GPIO_FLOATING);
            gpio_set_direction(GPIO_NUM_10, GPIO_MODE_INPUT);
            gpio_set_pull_mode(GPIO_NUM_10, GPIO_FLOATING);
            gpio_hold_dis(GPIO_NUM_9);
            gpio_hold_dis(GPIO_NUM_10);
        - logger.log:
            format: "User 3V3 rail disabled and user I2C bus pins floated for deep sleep."
            tag: sleep

globals:
  # Flip this from Home Assistant to keep the board awake for maintenance.
  - id: prevent_sleep_global
    type: bool
    restore_value: true
    initial_value: "false"

deep_sleep:
  id: deep_sleep_control
  run_duration: 120s
  sleep_duration: 15min

switch:
  - platform: template
    name: "Prevent Deep Sleep"
    id: prevent_sleep
    icon: "mdi:sleep-off"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - globals.set:
          id: prevent_sleep_global
          value: "true"
      - deep_sleep.prevent: deep_sleep_control
    on_turn_off:
      - globals.set:
          id: prevent_sleep_global
          value: "false"
      - deep_sleep.allow: deep_sleep_control
